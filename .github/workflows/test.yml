name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test docker-run
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        uses: step-security/action-shellcheck@v2

      - name: Set up QEMU
        uses: step-security/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@v4

      - name: Build
        uses: step-security/docker-build-push-action@v7
        id: docker-build
        with:
          context: test
          load: true
          push: false
          tags: user/app:latest

      - name: Run docker-run
        uses: ./
        id: test-app-1
        with:
          name: test-app-1
          image: user/app:latest
          args: |
            bash -c 'echo "Hello World" && ls'
            
      - name: Run docker-run from a dockerhub image 1
        uses: ./
        id: test-app-2
        with:
          name: test-app-2
          image: ubuntu:latest
          args: |
            bash -c 'echo "Hello World" && ls'

      - name: Run docker-run from a dockerhub image 2
        uses: ./
        id: test-app-3
        with:
          name: test-app-3
          image: ubuntu:latest
          args: |
            bash -c 'echo "Hello World 2" && ls -al'
            
      - name: Show output
        run: |
          echo '${{ toJSON(steps.test-app-1.outputs) }}'
          echo '${{ toJSON(steps.test-app-2.outputs) }}'
          echo '${{ toJSON(steps.test-app-3.outputs) }}'
        shell:
          bash

